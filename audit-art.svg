<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="The 30-minute old-house audit checklist">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe2"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4552d"/>
      <stop offset="1" stop-color="#97431f"/>
    </linearGradient>
  </defs>
  <rect width="560" height="400" rx="24" fill="url(#abg)"/>
  <!-- tape measure -->
  <g transform="translate(30,300) rotate(-8)">
    <rect x="0" y="0" width="200" height="22" rx="6" fill="#c89b3c"/>
    <rect x="8" y="6" width="184" height="10" fill="#e8cf9a"/>
    <g stroke="#8a6a3c" stroke-width="1.4">
      <line x1="16" y1="6" x2="16" y2="16"/><line x1="30" y1="6" x2="30" y2="16"/>
      <line x1="44" y1="6" x2="44" y2="16"/><line x1="58" y1="6" x2="58" y2="16"/>
      <line x1="72" y1="6" x2="72" y2="16"/><line x1="86" y1="6" x2="86" y2="16"/>
      <line x1="100" y1="6" x2="100" y2="16"/><line x1="114" y1="6" x2="114" y2="16"/>
      <line x1="128" y1="6" x2="128" y2="16"/><line x1="142" y1="6" x2="142" y2="16"/>
      <line x1="156" y1="6" x2="156" y2="16"/><line x1="170" y1="6" x2="170" y2="16"/>
      <line x1="184" y1="6" x2="184" y2="16"/>
    </g>
    <circle cx="20" cy="11" r="8" fill="#a8813f"/>
  </g>
  <!-- clipboard -->
  <g transform="translate(170,20)">
    <rect x="10" y="8" width="180" height="250" rx="10" fill="#fcf7ec" stroke="#c9b98f" stroke-width="3"/>
    <rect x="10" y="8" width="180" height="34" rx="10" fill="#f0e4c8"/>
    <rect x="70" y="-2" width="60" height="26" rx="6" fill="url(#clip)"/>
    <g stroke="#d9ccb2" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="70" x2="160" y2="70"/>
      <line x1="40" y1="100" x2="160" y2="100"/>
      <line x1="40" y1="130" x2="160" y2="130"/>
      <line x1="40" y1="160" x2="160" y2="160"/>
      <line x1="40" y1="190" x2="160" y2="190"/>
      <line x1="40" y1="220" x2="160" y2="220"/>
    </g>
    <g fill="#6f6a43">
      <path d="M36 68 l8 8 l16 -18"/>
      <path d="M36 98 l8 8 l16 -18"/>
      <path d="M36 128 l8 8 l16 -18"/>
      <path d="M36 158 l8 8 l16 -18"/>
      <path d="M36 188 l8 8 l16 -18"/>
    </g>
    <path d="M120 224 l26 10 l-10 -26 l26 -16 l-8 -4 l-18 22 l-12 -6 z" fill="#b4552d" opacity="0.85" transform="translate(8,-6)"/>
  </g>
  <!-- pencil -->
  <g transform="translate(340,240) rotate(24)">
    <rect x="0" y="0" width="110" height="14" rx="2" fill="#c89b3c"/>
    <rect x="0" y="0" width="28" height="14" rx="2" fill="#b4552d"/>
    <polygon points="0,0 -22,7 0,14" fill="#6f6a43"/>
    <rect x="104" y="-2" width="10" height="18" rx="3" fill="#241b12"/>
  </g>
  <!-- stamp -->
  <g transform="translate(390,140) rotate(-12)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="#fcf7ec" stroke="#c89b3c" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="55" y="34" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#b4552d" font-weight="bold">START</text>
    <text x="55" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#b4552d">HERE</text>
  </g>
</svg>