<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Mid-century living room with an arched window at dusk">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d150d"/>
      <stop offset="0.55" stop-color="#2f2417"/>
      <stop offset="1" stop-color="#43321f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4328"/>
      <stop offset="1" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.6" stop-color="#3d3a5c"/>
      <stop offset="1" stop-color="#b06a3c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c47a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2c47a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="credenza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a33"/>
      <stop offset="1" stop-color="#55391f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf3d8"/>
      <stop offset="1" stop-color="#e7c98c"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- room -->
  <rect width="640" height="760" fill="url(#wall)"/>
  <rect y="560" width="640" height="200" fill="url(#floor)"/>
  <!-- floor boards -->
  <g stroke="#2b1f12" stroke-width="2" opacity="0.5">
    <line x1="0" y1="600" x2="640" y2="600"/>
    <line x1="0" y1="650" x2="640" y2="650"/>
    <line x1="0" y1="700" x2="640" y2="700"/>
    <line x1="150" y1="560" x2="120" y2="760"/>
    <line x1="340" y1="560" x2="330" y2="760"/>
    <line x1="520" y1="560" x2="560" y2="760"/>
  </g>
  <!-- baseboard -->
  <rect y="548" width="640" height="12" fill="#1c140c"/>

  <!-- arch window -->
  <g transform="translate(120,110)">
    <path d="M0 380 L0 160 A110 110 0 0 1 220 160 L220 380 Z" fill="#14100a" stroke="#a8813f" stroke-width="14"/>
    <path d="M18 380 L18 160 A92 92 0 0 1 202 160 L202 380 Z" fill="url(#sky)"/>
    <!-- moon + stars -->
    <circle cx="150" cy="120" r="26" fill="url(#moon)"/>
    <g fill="#f7edd2">
      <circle cx="60" cy="90" r="2.4"/><circle cx="96" cy="150" r="1.8"/><circle cx="180" cy="200" r="2"/>
      <circle cx="120" cy="240" r="1.6"/><circle cx="70" cy="290" r="2.2"/>
    </g>
    <!-- mullions -->
    <line x1="110" y1="64" x2="110" y2="380" stroke="#14100a" stroke-width="7"/>
    <line x1="18" y1="220" x2="202" y2="220" stroke="#14100a" stroke-width="7"/>
    <!-- warm light beam -->
    <path d="M40 380 L100 60 L150 60 L70 380 Z" fill="url(#beam)" filter="url(#blur2)"/>
  </g>

  <!-- light pool on floor -->
  <ellipse cx="300" cy="580" rx="180" ry="40" fill="#f2c47a" opacity="0.10"/>

  <!-- sunburst clock -->
  <g transform="translate(500,200)">
    <circle r="46" fill="#1a1209" stroke="#c29a55" stroke-width="4"/>
    <g stroke="#c29a55" stroke-width="3">
      <line x1="0" y1="-58" x2="0" y2="-66"/><line x1="0" y1="58" x2="0" y2="66"/>
      <line x1="-58" y1="0" x2="-66" y2="0"/><line x1="58" y1="0" x2="66" y2="0"/>
      <line x1="-41" y1="-41" x2="-47" y2="-47"/><line x1="41" y1="-41" x2="47" y2="-47"/>
      <line x1="-41" y1="41" x2="-47" y2="47"/><line x1="41" y1="41" x2="47" y2="47"/>
    </g>
    <circle r="40" fill="#2c2012" stroke="#d8b56c" stroke-width="2"/>
    <line x1="0" y1="0" x2="-14" y2="-16" stroke="#e8c98a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="-22" stroke="#e8c98a" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="3" fill="#e8c98a"/>
  </g>

  <!-- credenza under window -->
  <g transform="translate(80,430)">
    <rect x="0" y="40" width="300" height="88" rx="4" fill="url(#credenza)"/>
    <rect x="0" y="40" width="300" height="10" fill="#8a6a3c"/>
    <g fill="#b98d4e"><rect x="40" y="84" width="8" height="30" rx="2"/><rect x="252" y="84" width="8" height="30" rx="2"/></g>
    <g fill="#f0d9a8" opacity="0.85"><rect x="70" y="60" width="4" height="46"/><rect x="130" y="60" width="4" height="46"/><rect x="200" y="60" width="4" height="46"/></g>
    <!-- legs -->
    <path d="M6 128 l-16 26" stroke="#5a3d20" stroke-width="8" stroke-linecap="round"/>
    <path d="M294 128 l16 26" stroke="#5a3d20" stroke-width="8" stroke-linecap="round"/>
    <!-- vase -->
    <path d="M232 40 c0 -18 26 -22 26 -44 c0 -14 -12 -16 -12 -16 s-12 2 -12 16 c0 22 26 26 26 44" fill="#8a5a2c" opacity="0.9" transform="translate(-26,0)"/>
    <path d="M190 8 c8 -22 -6 -30 -6 -30 s-14 8 -6 30 z" fill="#6f6a43"/>
    <path d="M188 6 c10 -16 2 -26 2 -26 s-12 10 -2 26 z" fill="#7d7850"/>
  </g>

  <!-- olive sofa -->
  <g transform="translate(430,470)">
    <ellipse cx="90" cy="70" rx="110" ry="22" fill="#1c140c" opacity="0.35"/>
    <rect x="-10" y="6" width="200" height="58" rx="10" fill="#6f6a43"/>
    <rect x="-10" y="6" width="200" height="16" rx="8" fill="#7d7850"/>
    <rect x="188" y="0" width="20" height="64" rx="10" fill="#635f3c"/>
    <rect x="-24" y="0" width="20" height="64" rx="10" fill="#635f3c"/>
    <path d="M6 64 l-14 20" stroke="#3a2c1b" stroke-width="7" stroke-linecap="round"/>
    <path d="M184 64 l14 20" stroke="#3a2c1b" stroke-width="7" stroke-linecap="round"/>
    <!-- cushions -->
    <rect x="22" y="20" width="70" height="34" rx="8" fill="#7a7450"/>
    <rect x="104" y="20" width="70" height="34" rx="8" fill="#6f6a43"/>
  </g>

  <!-- floor lamp -->
  <g transform="translate(590,470)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#a8813f" stroke-width="5"/>
    <path d="M-6 120 q6 16 6 26 l0 0 q0 -10 6 -26" fill="none"/>
    <path d="M-30 0 L0 -34 L30 0 Z" fill="#f2e3c2"/>
    <circle cx="0" cy="-30" r="3" fill="#f2c47a"/>
  </g>

  <!-- rug -->
  <ellipse cx="330" cy="640" rx="150" ry="34" fill="#b4552d" opacity="0.85"/>
  <ellipse cx="330" cy="640" rx="110" ry="24" fill="#c89b3c" opacity="0.7"/>
  <ellipse cx="330" cy="640" rx="62" ry="13" fill="#6f6a43" opacity="0.8"/>

  <!-- plant -->
  <g transform="translate(60,470)">
    <path d="M18 60 L14 96" stroke="#7a5a33" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 96 c-10 14 -6 26 2 34" fill="none" stroke="#7a5a33" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 96 c10 14 6 26 -2 34" fill="none" stroke="#7a5a33" stroke-width="7" stroke-linecap="round"/>
    <g fill="#4d5133">
      <path d="M14 60 c-26 -6 -30 -28 -12 -34 c-4 16 2 24 12 30 z"/>
      <path d="M14 60 c26 -6 30 -28 12 -34 c4 16 -2 24 -12 30 z"/>
      <path d="M14 56 c-18 -18 -10 -36 4 -36 c-6 14 -2 24 -4 36 z"/>
      <path d="M14 56 c18 -18 10 -36 -4 -36 c6 14 2 24 4 36 z"/>
    </g>
  </g>

  <!-- picture frame -->
  <g transform="translate(60,200)">
    <rect x="0" y="0" width="64" height="84" fill="#14100a" stroke="#a8813f" stroke-width="5"/>
    <rect x="8" y="8" width="48" height="68" fill="#6f6a43"/>
    <path d="M32 62 L18 30 L46 30 Z" fill="#c89b3c" opacity="0.9"/>
  </g>
</svg>