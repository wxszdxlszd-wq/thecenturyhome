<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Before: a gutted room with exposed lath and plywood floors">
  <defs>
    <linearGradient id="bwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b625a"/>
      <stop offset="1" stop-color="#8a7f72"/>
    </linearGradient>
    <linearGradient id="bfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99b88"/>
      <stop offset="1" stop-color="#7f7261"/>
    </linearGradient>
  </defs>
  <!-- wall -->
  <rect width="800" height="520" fill="url(#bwall)"/>
  <!-- exposed lath lines -->
  <g stroke="#574e46" stroke-width="3" opacity="0.85">
    <line x1="0" y1="140" x2="800" y2="140"/><line x1="0" y1="196" x2="800" y2="196"/>
    <line x1="0" y1="252" x2="800" y2="252"/><line x1="0" y1="308" x2="800" y2="308"/>
    <line x1="0" y1="364" x2="800" y2="364"/>
  </g>
  <g stroke="#574e46" stroke-width="6" opacity="0.9">
    <line x1="120" y1="90" x2="120" y2="420"/><line x1="240" y1="90" x2="240" y2="420"/>
    <line x1="360" y1="90" x2="360" y2="420"/><line x1="480" y1="90" x2="480" y2="420"/>
    <line x1="600" y1="90" x2="600" y2="420"/><line x1="720" y1="90" x2="720" y2="420"/>
  </g>
  <!-- plaster patches -->
  <g opacity="0.7">
    <path d="M40 100 q30 -18 70 0 q-10 26 -70 20 z" fill="#b9aea0"/>
    <path d="M520 180 q44 -24 96 0 q-18 40 -96 26 z" fill="#b3a795"/>
    <path d="M640 320 q36 -16 80 0 q-14 34 -80 22 z" fill="#bdb2a2"/>
  </g>
  <!-- window with tarp -->
  <g transform="translate(290,80)">
    <rect x="0" y="0" width="200" height="240" fill="#2c2622" stroke="#4a4038" stroke-width="10"/>
    <path d="M14 14 L186 226 M186 14 L14 226" stroke="#4a4038" stroke-width="5"/>
    <path d="M30 30 L170 60 L150 150 L40 120 Z" fill="#c7b8a0" opacity="0.6"/>
  </g>
  <!-- baseboard -->
  <rect y="404" width="800" height="12" fill="#5a5148"/>
  <!-- plywood floor -->
  <rect y="416" width="800" height="104" fill="url(#bfloor)"/>
  <g stroke="#6f6355" stroke-width="2" opacity="0.8">
    <line x1="0" y1="446" x2="800" y2="446"/><line x1="0" y1="478" x2="800" y2="478"/><line x1="0" y1="508" x2="800" y2="508"/>
    <line x1="180" y1="416" x2="170" y2="520"/><line x1="420" y1="416" x2="430" y2="520"/><line x1="650" y1="416" x2="640" y2="520"/>
  </g>
  <!-- ladder -->
  <g stroke="#8a5a2c" stroke-width="7" stroke-linecap="round">
    <line x1="120" y1="80" x2="70" y2="440"/><line x1="190" y1="80" x2="140" y2="440"/>
    <line x1="118" y1="180" x2="186" y2="180"/><line x1="112" y1="260" x2="181" y2="260"/>
    <line x1="106" y1="340" x2="175" y2="340"/>
  </g>
  <!-- toolbox + drop cloth -->
  <rect x="640" y="380" width="110" height="52" rx="6" fill="#c45b30"/>
  <rect x="640" y="380" width="110" height="14" rx="6" fill="#a84a26"/>
  <path d="M540 430 q40 -14 70 0 l-6 40 q-30 12 -60 0 z" fill="#9a9a86"/>
  <path d="M600 470 q30 -10 56 0 l-4 30 q-26 10 -50 0 z" fill="#aaa990"/>
  <!-- debris -->
  <g fill="#5f564b">
    <rect x="250" y="452" width="34" height="8" rx="2" transform="rotate(12 267 456)"/>
    <rect x="500" y="470" width="26" height="6" rx="2" transform="rotate(-10 513 473)"/>
  </g>
  <!-- cold vignette -->
  <rect width="800" height="520" fill="#3c4650" opacity="0.12"/>
</svg>