<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d4ed8">
<title>Order Confirmation · YG-M6pro / YG-Mt56i</title>
<style>
:root{
  --accent:#1d4ed8; --accent-dark:#173ea8; --bg:#f2f4f9; --card:#ffffff;
  --text:#111827; --muted:#6b7280; --line:#e5e7eb; --ok:#16a34a; --err:#dc2626;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.badge{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;flex:0 0 auto}
.top-title{font-size:14px;font-weight:600;line-height:1.25;flex:1;min-width:0}
.top-title small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.langbtn{border:1px solid var(--line);background:#fff;color:var(--accent);font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 11px;cursor:pointer;flex:0 0 auto}
.progress{height:4px;background:#e8ebf3;border-radius:0 0 4px 4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.stepchip{font-size:11.5px;color:var(--muted);padding:7px 0 0}
main{padding-top:14px}
.screen{display:none}
.screen.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-radius:var(--radius);color:#fff;padding:18px 16px;margin-bottom:14px}
.hero h1{font-size:19px;margin:0 0 6px;line-height:1.3}
.hero p{margin:0;font-size:13.5px;opacity:.94;line-height:1.5}
.card{background:var(--card);border-radius:var(--radius);padding:15px 14px;margin-bottom:13px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
h2.sec{font-size:16.5px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
h2.sec .n{width:22px;height:22px;border-radius:7px;background:#e8edfb;color:var(--accent);font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.secsub{color:var(--muted);font-size:12.5px;margin:6px 0 12px}
.q{padding:13px 0;border-top:1px solid #f0f2f7}
.q:first-of-type{border-top:none;padding-top:2px}
.q .qlabel{font-weight:600;font-size:15px;margin-bottom:2px}
.q .qhint{color:var(--muted);font-size:12.5px;margin-bottom:9px}
.q.err .qboxout{outline:1.5px solid var(--err);outline-offset:3px;border-radius:12px}
.q .errmsg{display:none;color:var(--err);font-size:12.5px;margin-top:6px}
.q.err .errmsg{display:block}
.opts{display:flex;flex-direction:column;gap:9px}
label.opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
label.opt:active{background:#f8faff}
label.opt input{position:absolute;opacity:0;pointer-events:none}
.rdot{width:21px;height:21px;border-radius:50%;border:2px solid #cbd2e0;flex:0 0 auto;margin-top:1px;position:relative;transition:border-color .15s}
.rdot:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s}
label.opt.sel{border-color:var(--accent);background:#f5f8ff}
label.opt.sel .rdot{border-color:var(--accent)}
label.opt.sel .rdot:after{transform:scale(1)}
.otext{flex:1;min-width:0}
.otext b{font-weight:600;font-size:14.5px;display:block}
.otext span{font-size:12.5px;color:var(--muted)}
.subinp{display:none;margin-top:10px;width:100%}
.subinp.show{display:block}
input[type=text],input[type=date],input[type=number],input[type=email],textarea{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:16px;
  font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border-color .15s;
}
input:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:#a6adbb}
textarea{min-height:86px;resize:vertical}
.prod{display:flex;gap:12px;align-items:flex-start}
.prod img{width:72px;height:auto;border-radius:10px;border:1px solid var(--line);flex:0 0 auto;background:#fff}
.prod .pi{flex:1;min-width:0}
.prod .sku{font-size:15px;font-weight:700}
.prod .pname{font-size:13.5px;color:var(--accent);font-weight:600;margin-bottom:6px}
.prod ul{margin:0;padding-left:17px;color:#374151;font-size:12.5px;line-height:1.55}
.prod .acc{font-size:12px;color:var(--muted);margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.fld{margin-top:11px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
.fld label em{font-style:normal;color:var(--muted);font-weight:400}
.revrow{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px solid #f0f2f7;font-size:14px;cursor:pointer}
.revrow:first-child{border-top:none}
.revrow .rk{color:var(--muted);flex:0 0 44%;font-size:13px}
.revrow .rv{font-weight:600;text-align:right;flex:1;word-break:break-word}
.revrow .rv.empty{color:#b3b9c6;font-weight:400}
.revsec{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 2px}
.revsec:first-child{margin-top:2px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.nav-in{max-width:600px;margin:0 auto;padding:0 14px;display:flex;gap:10px}
button.btn{flex:1;border:none;border-radius:12px;padding:15px 14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s,opacity .15s}
button.btn.primary{background:var(--accent);color:#fff;flex:1.7}
button.btn.primary:active{background:var(--accent-dark)}
button.btn.ghost{background:#fff;color:#374151;border:1.5px solid var(--line);flex:.8}
button.btn:disabled{opacity:.6;cursor:default}
.success{text-align:center;padding:26px 14px 8px}
.okc{width:72px;height:72px;border-radius:50%;background:#e9f9ef;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.okc svg{width:38px;height:38px}
.success h2{margin:0 0 8px;font-size:20px}
.success p{color:var(--muted);font-size:14px;margin:0 auto 16px;max-width:420px}
.refbox{display:inline-block;background:#fff;border:1.5px dashed #c9d2e6;border-radius:11px;padding:9px 13px;font-size:13.5px;margin-bottom:16px}
.refbox b{letter-spacing:.5px}
.copybtn{background:#fff;border:1.5px solid var(--line);color:var(--accent);font-weight:600;border-radius:11px;padding:12px 16px;font-size:14px;font-family:inherit;cursor:pointer}
.note{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px 12px;line-height:1.5}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:11px;padding:11px 12px;font-size:13px;margin-top:12px;display:none}
.errbox.show{display:block}
.errbox a{color:#991b1b;font-weight:600}
@media (min-width:640px){ .hero h1{font-size:21px} }
</style>
</head>

/* ===================== radio behaviour ===================== */
function syncOpt(label){
  var name = label.querySelector("input").name;
  $all('input[name="' + name + '"]').forEach(function(ri){
    var l = ri.closest("label.opt");
    l.classList.toggle("sel", ri.checked);
    var sub = l.nextElementSibling;
    if (ri.checked && sub && sub.classList && sub.classList.contains("subinp")) sub.classList.add("show");
  });
  /* hide other sub-inputs of this group that are not the selected option */
  $all(".subinp", label.closest(".q")).forEach(function(inp){
    var lbl = inp.previousElementSibling;
    if (lbl && lbl.classList && lbl.classList.contains("opt")){
      var on = lbl.querySelector("input").checked;
      if (!on) inp.classList.remove("show");
    }
  });
}
document.addEventListener("change", function(e){
  if (e.target.matches("label.opt input")){
    syncOpt(e.target.closest("label.opt"));
    var q = e.target.closest(".q"); if (q) q.classList.remove("err");
  }
});
document.addEventListener("click", function(e){
  var lb = e.target.closest("label.opt");
  if (lb){ var ri = lb.querySelector("input"); if (!ri.checked){ ri.checked = true; syncOpt(lb); } }
});

/* ===================== validation & nav ===================== */
function stepCard(n){ return $("#scr" + n); }
function markErr(qid, msg){
  var q = document.querySelector('.q[data-qid="' + qid + '"]');
  if (!q) return;
  q.classList.add("err");
  var m = $(".errmsg", q);
  if (m && msg) m.textContent = msg;
  if (!window.__firstErr) window.__firstErr = q;
}
function validate(n){
  window.__firstErr = null;
  var sec = DEF[n - 1];
  if (sec.kind === "products"){
    var total = digits($("#m6pro_qty").value | 0) + digits($("#mt56i_qty").value | 0);
    var q6 = Number(digits($("#m6pro_qty").value || "0")), q5 = Number(digits($("#mt56i_qty").value || "0"));
    if (!(q6 > 0 || q5 > 0)){ markErr("prod_m6pro", t("qty_err")); markErr("prod_mt56i", ""); }
  } else {
    sec.questions.forEach(function(q){
      if (q.type === "radio" && q.required){
        var sel = document.querySelector('input[name="' + q.id + '"]:checked');
        if (!sel){ markErr(q.id, t("q_required")); return; }
        var o = null; q.opts.forEach(function(x){ if (x.v === sel.value) o = x; });
        if (o && o.text){
          var si = (o.text === true) ? $("#" + q.id + "_other") : $("#" + o.text);
          if (si && si.classList.contains("show") && !si.value.trim()) markErr(q.id, t("q_textreq"));
        }
      }
      if (q.type === "text" && q.required){ if (!$("#" + q.id).value.trim()) markErr(q.id, t("q_textreq")); }
    });
  }
  if (window.__firstErr){
    window.__firstErr.scrollIntoView({behavior:"smooth", block:"center"});
    return false;
  }
  return true;
}
function show(n, skipScroll){
  cur = n;

  var target = $("#scr" + n); if (target) target.classList.add("active");
  $("#nav").style.display = (n > REVIEW) ? "none" : "";
  $("#stepchip").textContent = (n >= 1 && n <= TOTAL) ? t("step").replace("{n}", n).replace("{t}", TOTAL) : (n === REVIEW ? t("rev_title") : "");
  var pct = (n <= 0) ? 0 : (n >= REVIEW ? 100 : Math.round(n / TOTAL * 100));
  $("#pbar").style.width = pct + "%";
  $("#btnback").style.display = (n <= 0) ? "none" : "";
  if (n === 0){ $("#btnnext").textContent = t("start"); }
  else if (n === REVIEW){ $("#btnnext").textContent = t("submit"); $("#btnnext").dataset.action = "submit"; }
  else { $("#btnnext").textContent = t("next"); $("#btnnext").dataset.action = "next"; }
  if (!skipScroll) window.scrollTo({top:0, behavior:"smooth"});
}
function applyLang(){
  document.documentElement.lang = lang;
  $all("[data-t]").forEach(function(e){ e.textContent = t(e.getAttribute("data-t")); });
  $("#langbtn").textContent = (lang === "en") ? "PT" : "EN";
  /* rebuild questionnaire in the new language, preserving state */
  rebuildScreens();
  renderReview();
  show(cur, true);
}
/* ===================== review ===================== */
function optLabel(qid, v){
  var sec = null, q = null;
  DEF.forEach(function(s){ if (s.kind === "group") s.questions.forEach(function(x){ if (x.id === qid){ sec = s; q = x; } }); });
  if (!q) return v;
  var out = v; q.opts.forEach(function(o){ if (o.v === v) out = o[lang]; });
  return out;
}
function readState(){
  var st = {
    qty: {m6pro: $("#m6pro_qty") ? $("#m6pro_qty").value : "", mt56i: $("#mt56i_qty") ? $("#mt56i_qty").value : ""},
    rem: {m6pro: $("#m6pro_remarks") ? $("#m6pro_remarks").value : "", mt56i: $("#mt56i_remarks") ? $("#mt56i_remarks").value : ""},
    radio: {}, text: {}, notes: $("#notes") ? $("#notes").value : "",
    who: {name: $("#client_name").value.trim(), company: $("#client_company").value.trim(), email: $("#client_email").value.trim()},
    date: $("#target_date") ? $("#target_date").value : ""
  };
  DEF.forEach(function(s){
    if (s.kind !== "group") return;
    s.questions.forEach(function(q){
      if (q.type === "radio"){
        var sel = document.querySelector('input[name="' + q.id + '"]:checked');
        st.radio[q.id] = sel ? sel.value : "";
        var si = $("#" + q.id + "_other");
        if (si) st.text[q.id + "_other"] = si.value.trim();
      } else if (q.type === "text"){ st.text[q.id] = $("#" + q.id).value.trim(); }
      if (q.id === "pallet"){
        var ph = $("#pallet_height"); if (ph) st.text.pallet_height = ph.value.trim();
      }
    });
  });
  return st;
}
function rebuildScreens(){
  /* Re-render the questionnaire sections in the current language, keeping user input. */
  var st = readState();
  DEF.forEach(function(sec){
    var card = $("#scr" + sec.step);
    var inner = ['<h2 class="sec"><span class="n">' + sec.step + '</span><span class="sect">' + esc(sec[lang]) + '</span></h2>',
                 '<div class="secsub">' + esc(sec["sub_" + lang]) + '</div>'];
    if (sec.kind === "products"){
      sec.products.forEach(function(p){
        var feats = p["feats_" + lang].map(function(f){ return "<li>" + esc(f) + "</li>"; }).join("");
        inner.push('<div class="q" data-qid="prod_' + p.key + '"><div class="qboxout">' +
          '<div class="prod"><img src="' + p.img + '" alt="' + esc(p.sku) + '">' +
          '<div class="pi"><div class="sku">' + esc(p.sku) + '</div><div class="pname">' + esc(p[lang]) + '</div><ul>' + feats + '</ul>' +
          '<div class="acc">' + esc(p["acc_" + lang]) + '</div></div></div>' +
          '<div class="fld"><label>' + esc(t("qty_label")) + '</label><input type="text" inputmode="numeric" pattern="[0-9,]*" id="' + p.key + '_qty" value="' + esc(st.qty[p.key] !== undefined ? st.qty[p.key] : p.qty) + '" placeholder="0"></div>' +
          '<div class="fld"><label>' + esc(t("rem_label")) + '</label><input type="text" id="' + p.key + '_remarks" value="' + esc(st.rem[p.key] || "") + '" placeholder="' + esc(t("rem_ph")) + '"></div>' +
          '</div><div class="errmsg"></div></div>');
      });
    } else {
      sec.questions.forEach(function(q){
        inner.push('<div class="q" data-qid="' + q.id + '"><div class="qboxout">');
        inner.push('<div class="qlabel">' + esc(q[lang]) + '</div>');
        if (q.hint) inner.push('<div class="qhint">' + esc(t(q.hint)) + '</div>');
        if (q.type === "text"){
          inner.push('<input type="text" id="' + q.id + '" value="' + esc(st.text[q.id] !== undefined ? st.text[q.id] : (q.def || "")) + '" placeholder="' + esc(q["ph_" + lang] || "") + '">');
        } else if (q.type === "date"){
          inner.push('<input type="date" id="' + q.id + '" value="' + esc(st.date || "") + '">');
        } else {
          inner.push('<div class="opts">');
          var chosen = st.radio[q.id] !== undefined ? st.radio[q.id] : (q.def || "");
          q.opts.forEach(function(o){
            inner.push('<label class="opt' + (chosen === o.v ? " sel" : "") + '" data-v="' + o.v + '"><input type="radio" name="' + q.id + '" value="' + o.v + '"' + (chosen === o.v ? " checked" : "") + '>' +
              '<span class="rdot"></span><span class="otext"><b>' + esc(o[lang]) + '</b></span></label>');
            if (o.text){
              var sid = (o.text === true) ? (q.id + "_other") : o.text;
              var sval = st.text[q.id + "_other"] !== undefined ? st.text[q.id + "_other"] : "";
              if (o.text !== true) sval = st.text[o.text] !== undefined ? st.text[o.text] : "";
              inner.push('<input type="text" class="subinp' + (chosen === o.v ? " show" : "") + '" id="' + sid + '" value="' + esc(sval) + '" placeholder="' + esc(o["ph_" + lang] || "") + '">');
            }
          });
          inner.push('</div>');
        }
        inner.push('</div><div class="errmsg"></div></div>');
      });
    }
    card.innerHTML = inner.join("");
  });
}
function fmtDate(v){
  if (!v) return "";
  try { var d = new Date(v + "T00:00:00"); return d.toLocaleDateString(lang === "pt" ? "pt-PT" : "en-GB", {day:"numeric", month:"short", year:"numeric"}); }
  catch(e){ return v; }
}
function renderReview(){
  $("#revh").textContent = t("rev_title");
  $("#revsub").textContent = t("rev_sub");
  $("#noteslbl").textContent = t("notes_label");
  $("#notes").placeholder = t("notes_ph");
  var st = readState();
  var h = [];
  function row(qid, label, value, empty){
    h.push('<div class="revrow" data-goto="' + qid + '"><span class="rk">' + esc(label) + '</span><span class="rv' + ((!value) ? " empty" : "") + '">' + esc(value || t("rev_empty")) + '</span></div>');
  }
  h.push('<div class="revsec">' + esc(DEF[0][lang]) + '</div>');
  DEF[0].products.forEach(function(p){
    row("prod_" + p.key, p.sku + " — " + p[lang], digits(st.qty[p.key]) ? digits(st.qty[p.key]) + " " + t("pcs") : "", !st.qty[p.key]);
    if (st.rem[p.key]) row("prod_" + p.key, p.sku + " · " + t("rem_label").replace(" (optional)","").replace(" (opcional)",""), st.rem[p.key], false);
  });
  DEF.slice(1).forEach(function(sec){
    h.push('<div class="revsec">' + esc(sec[lang]) + '</div>');
    sec.questions.forEach(function(q){
      var val = "";
      if (q.type === "radio"){
        val = st.radio[q.id] ? optLabel(q.id, st.radio[q.id]) : "";
        if (st.radio[q.id] === "other" || st.radio[q.id] === "custom" || st.radio[q.id] === "local" || st.radio[q.id] === "pallets"){
          var extra = (q.id === "pallet") ? st.text.pallet_height : st.text[q.id + "_other"];
          if (extra) val += " — " + extra;
        }
      } else if (q.type === "text"){ val = st.text[q.id] || ""; }
      else if (q.type === "date"){ val = fmtDate(st.date); }
      row(q.id, q[lang], val, !val);
    });
  });
  if (st.who.name || st.who.company || st.who.email){
    h.push('<div class="revsec">' + esc(t("ident_title")) + '</div>');
    if (st.who.name) row("who", t("fld_name"), st.who.name, false);
    if (st.who.company) row("who", t("fld_company"), st.who.company, false);
    if (st.who.email) row("who", t("fld_email"), st.who.email, false);
  }
  $("#revcard").innerHTML = h.join("");
  $("#revnote").textContent = t("intro_note");
  var eb = $("#errbox");
  if (eb.dataset.keep !== "1"){ eb.classList.remove("show"); }
}
document.addEventListener("click", function(e){
  var r = e.target.closest(".revrow"); if (!r) return;
  var qid = r.getAttribute("data-goto");
  var n = 0;
  if (qid === "who"){ n = 0; } else {
    DEF.forEach(function(s){ if (s.kind === "products" && qid.indexOf("prod_") === 0) n = 1;
      if (s.kind === "group") s.questions.forEach(function(q){ if (q.id === qid) n = s.step; }); });
  }
  if (n === 0){ show(0, true); window.scrollTo({top: document.body.scrollHeight, behavior:"smooth"}); return; }
  editReturn = REVIEW;                 /* editing one item returns to the review screen */
  show(n);
  var q = document.querySelector('.q[data-qid="' + qid + '"]');
  if (q){ q.scrollIntoView({behavior:"smooth", block:"center"}); q.style.transition = "background .4s"; var old = q.style.background; q.style.background = "#fffbe8"; setTimeout(function(){ q.style.background = old; }, 1400); }
});

/* ===================== nav ===================== */
var editReturn = null;   /* set when the user jumps into a question from the review screen */
$("#btnnext").addEventListener("click", function(){
  if (this.dataset.action === "submit"){ submit(); return; }
  if (cur === 0){ show(1); return; }
  if (cur >= 1 && cur <= TOTAL){
    if (!validate(cur)) return;
    if (editReturn !== null){ var back = editReturn; editReturn = null; show(back); return; }
    show(cur + 1);
  }
});
$("#btnback").addEventListener("click", function(){ editReturn = null; if (cur > 0) show(cur - 1); });
$("#langbtn").addEventListener("click", function(){
  if (cur >= 1 && cur <= TOTAL && !validate(cur)) { /* still allow, but keep errors visible */ }
  lang = (lang === "en") ? "pt" : "en";
  applyLang();
});

/* ===================== submit ===================== */
function makeRef(){
  var d = new Date(), p = function(n){ return (n < 10 ? "0" : "") + n; };
  return (TOKEN || "OC").toUpperCase() + "-" + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}
function buildSummaryText(){
  var st = readState(), lines = [];
  lines.push(t("sum_head"));
  lines.push("Ref: " + makeRef());
  st.qty.m6pro = digits(st.qty.m6pro); st.qty.mt56i = digits(st.qty.mt56i);
  DEF[0].products.forEach(function(p){
    if (st.qty[p.key]) lines.push("• " + p.sku + " (" + p[lang] + "): " + st.qty[p.key] + " " + t("pcs"));
    if (st.rem[p.key]) lines.push("  " + p.sku + " remarks: " + st.rem[p.key]);
  });
  DEF.slice(1).forEach(function(sec){
    lines.push("— " + sec[lang]);
    sec.questions.forEach(function(q){
      var val = "";
      if (q.type === "radio"){
        val = st.radio[q.id] ? optLabel(q.id, st.radio[q.id]) : "";
        var extra = (q.id === "pallet") ? st.text.pallet_height : st.text[q.id + "_other"];
        if (extra && val) val += " — " + extra;
      } else if (q.type === "text"){ val = st.text[q.id] || ""; }
      else if (q.type === "date"){ val = fmtDate(st.date); }
      if (val) lines.push("• " + q[lang] + ": " + val);
    });
  });
  if (st.who.name || st.who.company || st.who.email){
    lines.push("— " + t("ident_title"));
    if (st.who.name) lines.push("• " + t("fld_name") + ": " + st.who.name);
    if (st.who.company) lines.push("• " + t("fld_company") + ": " + st.who.company);
    if (st.who.email) lines.push("• " + t("fld_email") + ": " + st.who.email);
  }
  var notes = $("#notes").value.trim();
  if (notes) lines.push("— " + t("notes_label") + "\n" + notes);
  return lines.join("\n");
}
var busy = false;
function submit(){
  if (busy) return;
  /* final validation across all steps */
  for (var i = 1; i <= TOTAL; i++){ if (!validate(i)){ show(i); return; } }
  var st = readState();
  var payload = {
    token: TOKEN, ref: makeRef(), lang: lang, site: SITE,
    submitted_at: new Date().toISOString(),
    tz: (function(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){ return ""; } })(),
    ua: navigator.userAgent,
    website: $("#website").value,
    answers: {
      client_name: st.who.name, client_company: st.who.company, client_email: st.who.email,
      m6pro_qty: digits(st.qty.m6pro), m6pro_remarks: st.rem.m6pro,
      mt56i_qty: digits(st.qty.mt56i), mt56i_remarks: st.rem.mt56i,
      destination: st.text.destination || "",
      incoterms: st.radio.incoterms || "", incoterms_other: st.text.incoterms_other || "",
      shipping: st.radio.shipping || "",
      target_date: st.date || "",
      color: st.radio.color || "", color_other: st.text.color_other || "",
      ui_language: st.radio.ui_language || "", ui_language_other: st.text.ui_language_other || "",
      cert: st.radio.cert || "", cert_other: st.text.cert_other || "",
      box: st.radio.box || "", labels: st.radio.labels || "",
      carton: st.radio.carton || "", pallet: st.radio.pallet || "", pallet_height: st.text.pallet_height || "",
      notes: $("#notes").value.trim(),
      summary_text: buildSummaryText()
    }
  };
  busy = true;
  var btn = $("#btnnext"), eb = $("#errbox");
  eb.dataset.keep = "0"; eb.classList.remove("show");
  var oldLabel = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + esc(t("submitting"));
  function doPost(url){
    return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); });
  }
  var ep = apiEndpoint();
  doPost(ep)
    .catch(function(){ return {ok:false}; })
    .then(function(j){
      if (j && j.ok) return j;
      if (ep !== API_ABS) return doPost(API_ABS);
      throw new Error("send failed");
    })
    .then(function(j){
      if (!j || !j.ok) throw new Error("send failed");
      finish(payload);
    })
    .catch(function(){
      busy = false; btn.disabled = false; btn.textContent = oldLabel;
      var mail = mailAddr();
      var subj = encodeURIComponent("[Order Confirmation] " + makeRef());
      var body = encodeURIComponent(buildSummaryText());
      eb.innerHTML = esc(t("err_net")) + ' <a href="mailto:' + mail + '?subject=' + subj + '&body=' + body + '">' + esc(mail) + '</a>';
      eb.classList.add("show"); eb.dataset.keep = "1";
      eb.scrollIntoView({behavior:"smooth", block:"center"});
    });
}
function finish(payload){
  document.querySelector("main").style.display = "none";
  $("#nav").style.display = "none";
  var chip = $("#stepchip"); if (chip) chip.textContent = "";
  $("#pbar").style.width = "100%";
  $("#refval").textContent = payload.ref;
  var box = $("#scr_success");
  box.style.display = "";
  $("#copybtn").textContent = t("copy_btn");
  $("#copybtn").onclick = function(){
    var txt = buildSummaryText(), self = this;
    function done(){ self.textContent = t("copied"); setTimeout(function(){ self.textContent = t("copy_btn"); }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, done); }
    else { var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }
  };
  window.scrollTo({top:0, behavior:"smooth"});
}
/* ===================== init ===================== */
(function init(){
  var d = new Date(), iso = d.toISOString().slice(0, 10);
  $("#target_date").min = iso;
  applyLang();
  show(0, true);
})();
</script>
</body>
</html>
